<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>Mes Relances</title>
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:700;src:url("fonts/bricolage-grotesque-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-weight:500;src:url("fonts/figtree-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2")}
:root{
  --card:#FFFFFF; --fg:#1B2030; --muted:#5E6577; --line:#DADEE6; --track:#E3E8FB; --accent:#2B47C9; --on-accent:#fff; --late:#C2410C;
  color-scheme:light;
}
:root.dark{
  --card:#1A1E29; --fg:#E8EAF0; --muted:#9AA1B2; --line:#2F3546; --track:#252E55; --accent:#8EA2FF; --on-accent:#10142A; --late:#FF9A62;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-app-region:drag;cursor:default}
.card{position:absolute;inset:6px;border-radius:18px;background:var(--card);border:1px solid var(--line);
  display:grid;grid-template-rows:1fr auto;padding:30px 30px 20px;color:var(--fg);font:500 14px/1.45 "Figtree",system-ui,"Segoe UI",sans-serif}
.top{display:grid;justify-items:center;align-content:center;gap:12px;text-align:center}
.logo{width:72px;height:72px}
.logo .env{transform-origin:36px 40px;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.logo .flap{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .2s ease-out forwards}
.logo .badge{transform-origin:56px 18px;transform:scale(0);animation:pop .4s .5s cubic-bezier(.2,.9,.3,1.4) forwards}
.logo .tick{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .3s .75s ease-out forwards}
h1{margin:0;font:700 26px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.hello{color:var(--muted);min-height:1.45em}
.today{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:26px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--track);color:var(--accent);font-weight:600;opacity:0;animation:fade .4s .6s forwards}
.chip.hot{background:color-mix(in srgb,var(--late) 15%,transparent);color:var(--late)}
.bottom{display:grid;gap:8px}
.bar{height:4px;border-radius:99px;background:var(--track);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:99px;animation:load 1.6s cubic-bezier(.4,0,.2,1) forwards}
.row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.ver{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes load{0%{width:0}60%{width:70%}100%{width:92%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <svg class="logo" viewBox="0 0 72 72" aria-hidden="true">
      <g class="env">
        <rect x="6" y="20" width="56" height="40" rx="9" fill="var(--accent)"/>
        <path class="flap" d="M10 25l24 18 24-18" fill="none" stroke="var(--on-accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g class="badge">
        <circle cx="56" cy="18" r="13" fill="var(--late)" stroke="var(--card)" stroke-width="3"/>
        <path class="tick" d="M50 18l4.5 4.5L62 14" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
    <h1>Mes Relances</h1>
    <div class="hello" id="hello"></div>
    <div class="today" id="today"></div>
  </div>
  <div class="bottom">
    <div class="bar"><i></i></div>
    <div class="row"><span id="status">Ouverture…</span><span class="ver" id="ver"></span></div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('dark') === '1') document.documentElement.classList.add('dark');
  const nom = q.get('nom');
  const h = new Date().getHours();
  document.getElementById('hello').textContent = (h >= 18 || h < 5 ? 'Bonsoir' : 'Bonjour') + (nom ? ' ' + nom : '') + ' !';
  document.getElementById('ver').textContent = 'v' + (q.get('v') || '');
  const chips = JSON.parse(q.get('info') || '[]');
  const box = document.getElementById('today');
  chips.forEach(([txt, hot]) => { const s = document.createElement('span'); s.className = 'chip' + (hot ? ' hot' : ''); s.textContent = txt; box.appendChild(s); });
  const steps = ['Ouverture…', 'Chargement de vos candidatures…', 'Vérification des rappels…', 'Presque prêt…'];
  let i = 0; const st = document.getElementById('status');
  setInterval(() => { if (i < steps.length - 1) st.textContent = steps[++i]; }, 450);
</script>
</body>
</html>
